<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Feliz Cumpleaños 💌</title>

  <style>
    /* =========================================================
       IMPORTANTE:
       Sube estos 4 archivos a la misma carpeta que este index.html:

       1.jpg = portada
       2.jpg = sobre
       3.jpg = carta abierta
       4.jpg = pastel con velas

       NO necesitas convertirlos a Base64.
       ========================================================= */


    /* =========================================================
       RESET
       ========================================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    /* =========================================================
       CUERPO / FONDO
       ========================================================= */

    body {
      min-height: 100vh;
      width: 100%;
      background:
        linear-gradient(
          rgba(236, 177, 159, 0.94),
          rgba(236, 177, 159, 0.94)
        ),
        repeating-linear-gradient(
          45deg,
          #e6a997 0px,
          #e6a997 8px,
          #efb7a5 8px,
          #efb7a5 16px
        );

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Georgia, "Times New Roman", serif;

      overflow: hidden;
      padding: 20px;
    }


    /* =========================================================
       DECORACIÓN DE FONDO
       ========================================================= */

    body::before {
      content: "";
      position: fixed;
      inset: 0;

      background-image:
        radial-gradient(
          rgba(255,255,255,0.20) 1px,
          transparent 1px
        );

      background-size: 6px 6px;

      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
    }


    /* =========================================================
       CONTENEDOR PRINCIPAL
       ========================================================= */

    .card-container {
      position: relative;

      width: min(94vw, 1050px);

      aspect-ratio: 3 / 2;

      perspective: 1800px;

      z-index: 5;
    }


    /* =========================================================
       TARJETA PRINCIPAL
       ========================================================= */

    .card {
      width: 100%;
      height: 100%;

      position: relative;

      transform-style: preserve-3d;

      transition:
        transform 1.15s cubic-bezier(0.22, 0.61, 0.36, 1);

      cursor: pointer;

      border-radius: 10px;

      box-shadow:
        0 25px 60px rgba(70, 30, 20, 0.30);

      transform: rotateY(0deg);
    }


    .card.open {
      transform: rotateY(180deg);
    }


    /* =========================================================
       CARAS DE LA TARJETA
       ========================================================= */

    .card-face {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;

      overflow: hidden;

      border-radius: 10px;
    }


    /* =========================================================
       PORTADA
       ========================================================= */

    .front {
      background: #efb09f;

      display: flex;
      justify-content: center;
      align-items: center;

      transform: rotateY(0deg);

      z-index: 2;
    }


    .portada-img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;

      transition:
        transform 0.8s ease,
        filter 0.8s ease;
    }


    .front:hover .portada-img {
      transform: scale(1.015);
      filter: brightness(1.03);
    }


    /* =========================================================
       TEXTO DE "TOCA PARA ABRIR"
       ========================================================= */

    .abrir-indicador {
      position: absolute;

      bottom: 25px;
      left: 50%;

      transform: translateX(-50%);

      background: rgba(255, 248, 235, 0.92);

      color: #a52d35;

      padding: 11px 25px;

      border-radius: 30px;

      font-size: 16px;

      font-weight: bold;

      letter-spacing: 1px;

      box-shadow:
        0 5px 15px rgba(70, 30, 20, 0.20);

      animation: respirar 2s ease-in-out infinite;

      pointer-events: none;

      white-space: nowrap;
    }


    @keyframes respirar {

      0%,
      100% {
        transform: translateX(-50%) translateY(0);
      }

      50% {
        transform: translateX(-50%) translateY(-5px);
      }

    }


    /* =========================================================
       INTERIOR
       ========================================================= */

    .back {
      transform: rotateY(180deg);

      background: #efb19f;

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 0;

      z-index: 1;
    }


    /* =========================================================
       PÁGINAS INTERIORES
       ========================================================= */

    .page {
      position: relative;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #efb19f;
    }


    .page-left {
      border-right: 2px solid rgba(130, 45, 45, 0.15);
    }


    .page-right {
      border-left: 2px solid rgba(130, 45, 45, 0.15);
    }


    /* =========================================================
       SOBRE
       ========================================================= */

    .sobre-wrapper {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 90%;
      height: 90%;

      transform: translate(-50%, -50%);

      display: flex;
      justify-content: center;
      align-items: center;
    }


    .sobre-img {
      position: absolute;

      width: 100%;
      height: 100%;

      object-fit: contain;

      display: block;

      z-index: 5;

      filter:
        drop-shadow(0 10px 13px rgba(70, 25, 20, 0.25));

      transition:
        opacity 0.45s ease,
        transform 0.7s cubic-bezier(0.22, 0.61, 0.36, 1);
    }


    /* =========================================================
       CARTA ABIERTA
       ========================================================= */

    .carta-img {
      position: absolute;

      width: 100%;
      height: 100%;

      object-fit: contain;

      display: block;

      z-index: 10;

      opacity: 0;

      pointer-events: none;

      transform:
        translateY(45%)
        scale(0.72)
        rotate(-2deg);

      transform-origin: bottom center;

      filter:
        drop-shadow(0 15px 20px rgba(70, 25, 20, 0.25));

      transition:
        opacity 0.35s ease,
        transform 0.85s cubic-bezier(0.22, 0.61, 0.36, 1);
    }


    /* CUANDO LA CARTA ESTÁ ABIERTA */

    .sobre-wrapper.carta-abierta .carta-img {
      opacity: 1;

      pointer-events: auto;

      transform:
        translateY(0)
        scale(1)
        rotate(0deg);

      cursor: pointer;
    }


    /* El sobre se hace ligeramente más pequeño */

    .sobre-wrapper.carta-abierta .sobre-img {
      transform: scale(0.90);

      filter:
        brightness(0.82)
        drop-shadow(0 5px 10px rgba(70, 25, 20, 0.15));
    }


    /* =========================================================
       INDICADOR DE LA CARTA
       ========================================================= */

    .texto-carta {
      position: absolute;

      left: 50%;
      bottom: 18px;

      transform: translateX(-50%);

      z-index: 30;

      background: rgba(255, 248, 235, 0.94);

      color: #a52d35;

      padding: 8px 17px;

      border-radius: 20px;

      font-size: 13px;

      font-weight: bold;

      box-shadow:
        0 4px 12px rgba(70, 30, 20, 0.18);

      pointer-events: none;

      white-space: nowrap;

      transition: opacity 0.3s ease;
    }


    .sobre-wrapper.carta-abierta .texto-carta {
      opacity: 0;
    }


    /* =========================================================
       PASTEL
       ========================================================= */

    .pastel-wrapper {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 94%;
      height: 94%;

      transform: translate(-50%, -50%);

      display: flex;
      justify-content: center;
      align-items: center;
    }


    .pastel-img {
      width: 100%;
      height: 100%;

      object-fit: contain;

      display: block;

      filter:
        drop-shadow(0 10px 14px rgba(80, 25, 25, 0.20));

      transition:
        filter 0.3s ease;
    }


    /* =========================================================
       LLAMAS INTERACTIVAS
       
       IMPORTANTE:
       Las llamas originales están dentro de 4.jpg.
       Estos elementos se colocan encima de ellas para
       crear el efecto de fuego interactivo.
       ========================================================= */

    .llamas-interactivas {
      position: absolute;

      inset: 0;

      pointer-events: none;

      z-index: 20;
    }


    .llama {
      position: absolute;

      width: 5.7%;

      aspect-ratio: 0.55;

      transform-origin: 50% 90%;

      transition:
        opacity 0.3s ease,
        transform 0.15s ease;

      filter:
        drop-shadow(0 0 5px rgba(255, 170, 0, 0.75));
    }


    /* Fuego visual creado encima de las velas */

    .llama::before {
      content: "";

      position: absolute;

      left: 50%;
      top: 15%;

      width: 60%;
      height: 72%;

      transform:
        translateX(-50%)
        rotate(3deg);

      background:
        linear-gradient(
          to top,
          #ff5a16 0%,
          #ff9d00 55%,
          #ffe36b 100%
        );

      border-radius:
        55% 45% 55% 45% /
        70% 70% 30% 30%;

      clip-path:
        polygon(
          50% 0%,
          70% 30%,
          100% 48%,
          75% 100%,
          50% 88%,
          25% 100%,
          0% 48%,
          30% 30%
        );

      animation:
        fuego 0.35s ease-in-out infinite alternate;
    }


    .llama::after {
      content: "";

      position: absolute;

      left: 50%;
      top: 39%;

      width: 27%;
      height: 35%;

      transform: translateX(-50%);

      background: #fff1a8;

      border-radius: 50% 50% 45% 45%;

      filter: blur(0.4px);
    }


    /* Posiciones de las 3 llamas */

    .llama1 {
      left: 22.5%;
      top: 34.5%;
    }


    .llama2 {
      left: 46.2%;
      top: 33.7%;
    }


    .llama3 {
      left: 69.8%;
      top: 35%;
    }


    @keyframes fuego {

      from {
        transform:
          translateX(-50%)
          rotate(-4deg)
          scaleY(0.94);
      }

      to {
        transform:
          translateX(-50%)
          rotate(5deg)
          scaleY(1.07);
      }

    }


    /* =========================================================
       CUANDO LAS VELAS SE APAGAN
       ========================================================= */

    .velas-apagadas .llama {
      opacity: 0;
      transform: scale(0.2) translateY(10px);
    }


    /* Parches para tapar las llamas que ya vienen dibujadas
       dentro de la imagen 4.jpg */

    .apagador {
      position: absolute;

      width: 8%;

      height: 7%;

      background: #ecb19f;

      border-radius: 50%;

      opacity: 0;

      z-index: 19;

      transition: opacity 0.3s ease;

      pointer-events: none;
    }


    .apagador1 {
      left: 21.5%;
      top: 34.5%;
    }


    .apagador2 {
      left: 45%;
      top: 33.8%;
    }


    .apagador3 {
      left: 68.5%;
      top: 35%;
    }


    .velas-apagadas .apagador {
      opacity: 1;
    }


    /* =========================================================
       HUMITO DESPUÉS DE APAGAR
       ========================================================= */

    .humo {
      position: absolute;

      width: 5%;

      height: 10%;

      opacity: 0;

      z-index: 25;

      pointer-events: none;

      transition: opacity 0.3s ease;
    }


    .humo::before,
    .humo::after {
      content: "";

      position: absolute;

      border-radius: 50%;

      background: rgba(255,255,255,0.55);

      filter: blur(2px);
    }


    .humo::before {
      width: 65%;
      height: 45%;

      left: 5%;
      bottom: 20%;
    }


    .humo::after {
      width: 55%;
      height: 40%;

      right: 0;
      top: 0;
    }


    .humo1 {
      left: 24%;
      top: 30%;
    }


    .humo2 {
      left: 47.5%;
      top: 29%;
    }


    .humo3 {
      left: 71%;
      top: 30.5%;
    }


    .velas-apagadas .humo {
      opacity: 1;

      animation:
        subirHumo 2s ease-out forwards;
    }


    @keyframes subirHumo {

      0% {
        transform:
          translateY(10px)
          scale(0.6);

        opacity: 0;
      }

      35% {
        opacity: 0.8;
      }

      100% {
        transform:
          translateY(-30px)
          scale(1.2);

        opacity: 0;
      }

    }


    /* =========================================================
       CONTROLES DEL PASTEL
       ========================================================= */

    .controles {
      position: absolute;

      left: 50%;

      bottom: 15px;

      transform: translateX(-50%);

      z-index: 50;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 8px;

      width: 95%;

      pointer-events: auto;
    }


    .boton-soplar,
    .boton-encender {
      border: none;

      border-radius: 25px;

      padding: 9px 15px;

      background: #a52d35;

      color: #fff8eb;

      font-family: Georgia, "Times New Roman", serif;

      font-size: 12px;

      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 4px 10px rgba(80, 25, 25, 0.25);

      transition:
        transform 0.15s ease,
        background 0.2s ease;
    }


    .boton-soplar:hover,
    .boton-encender:hover {
      background: #8e222b;

      transform: translateY(-2px);
    }


    .boton-soplar:active,
    .boton-encender:active {
      transform: scale(0.94);
    }


    .boton-encender {
      display: none;
    }


    .velas-apagadas ~ .controles .boton-soplar {
      display: none;
    }


    .velas-apagadas ~ .controles .boton-encender {
      display: block;
    }


    /* =========================================================
       MEDIDOR DEL MICRÓFONO
       ========================================================= */

    .microfono {
      position: absolute;

      left: 12px;
      bottom: 15px;

      z-index: 50;

      display: flex;

      align-items: center;

      gap: 6px;

      background: rgba(255,248,235,0.90);

      padding: 6px 9px;

      border-radius: 15px;

      font-family: Georgia, "Times New Roman", serif;

      font-size: 10px;

      color: #6e3131;

      box-shadow:
        0 3px 8px rgba(70,25,20,0.15);

      pointer-events: none;
    }


    .barra-mic {
      width: 45px;

      height: 6px;

      overflow: hidden;

      border-radius: 5px;

      background: #dbcac0;
    }


    .nivel-mic {
      width: 0%;

      height: 100%;

      background: #a52d35;

      transition: width 0.08s linear;
    }


    /* =========================================================
       BOTÓN PARA VOLVER AL SOBRE
       ========================================================= */

    .volver-sobre {
      position: absolute;

      left: 50%;
      bottom: 12px;

      transform: translateX(-50%);

      z-index: 60;

      border: none;

      background: rgba(255,248,235,0.94);

      color: #a52d35;

      border-radius: 20px;

      padding: 7px 15px;

      font-family: Georgia, "Times New Roman", serif;

      font-size: 11px;

      font-weight: bold;

      cursor: pointer;

      opacity: 0;

      pointer-events: none;

      transition:
        opacity 0.3s ease,
        transform 0.2s ease;
    }


    .volver-sobre.visible {
      opacity: 1;

      pointer-events: auto;
    }


    .volver-sobre:hover {
      transform:
        translateX(-50%)
        translateY(-2px);
    }


    /* =========================================================
       MENSAJE AL APAGAR LAS VELAS
       ========================================================= */

    .mensaje-deseo {
      position: absolute;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%)
        scale(0.8);

      z-index: 100;

      background: rgba(255,248,235,0.96);

      color: #a52d35;

      padding: 14px 20px;

      border-radius: 18px;

      text-align: center;

      font-family: Georgia, "Times New Roman", serif;

      font-size: 17px;

      font-weight: bold;

      box-shadow:
        0 10px 30px rgba(70,25,20,0.25);

      border: 2px dashed #a52d35;

      opacity: 0;

      pointer-events: none;

      transition:
        opacity 0.4s ease,
        transform 0.4s ease;
    }


    .mensaje-deseo.visible {
      opacity: 1;

      transform:
        translate(-50%, -50%)
        scale(1);
    }


    /* =========================================================
       CONFETI
       ========================================================= */

    .confeti-container {
      position: fixed;

      inset: 0;

      overflow: hidden;

      pointer-events: none;

      z-index: 1000;
    }


    .confeti {
      position: absolute;

      top: -20px;

      width: 9px;
      height: 14px;

      opacity: 0;

      animation:
        caerConfeti 3.5s linear forwards;
    }


    @keyframes caerConfeti {

      0% {
        transform:
          translateY(-20px)
          rotate(0deg);

        opacity: 1;
      }

      100% {
        transform:
          translateY(110vh)
          rotate(720deg);

        opacity: 0;
      }

    }


    /* =========================================================
       INSTRUCCIÓN PEQUEÑA
       ========================================================= */

    .ayuda-soplo {
      position: absolute;

      right: 12px;
      bottom: 15px;

      z-index: 50;

      background: rgba(255,248,235,0.88);

      color: #6e3131;

      padding: 6px 9px;

      border-radius: 15px;

      font-size: 9px;

      box-shadow:
        0 3px 8px rgba(70,25,20,0.12);

      pointer-events: none;
    }


    /* =========================================================
       RESPONSIVE
       ========================================================= */

    @media (max-width: 800px) {

      body {
        padding: 10px;
      }


      .card-container {
        width: 96vw;

        aspect-ratio: 2 / 3;
      }


      .back {
        grid-template-columns: 1fr;

        grid-template-rows: 1fr 1fr;

        overflow-y: auto;
      }


      .page-left {
        border-right: none;

        border-bottom: 2px solid rgba(130,45,45,0.15);
      }


      .page-right {
        border-left: none;

        border-top: 2px solid rgba(130,45,45,0.15);
      }


      .sobre-wrapper {
        width: 88%;
        height: 88%;
      }


      .pastel-wrapper {
        width: 88%;
        height: 88%;
      }


      .abrir-indicador {
        font-size: 13px;

        bottom: 15px;

        padding: 8px 15px;
      }


      .microfono,
      .ayuda-soplo {
        display: none;
      }

    }


    @media (max-width: 480px) {

      .card-container {
        width: 94vw;

        aspect-ratio: 0.70;
      }


      .back {
        grid-template-rows: 1fr 1fr;
      }


      .controles {
        bottom: 8px;
      }


      .boton-soplar,
      .boton-encender {
        font-size: 10px;

        padding: 7px 11px;
      }


      .mensaje-deseo {
        width: 75%;

        font-size: 14px;
      }

    }


    /* =========================================================
       ACCESIBILIDAD
       ========================================================= */

    button:focus-visible {
      outline: 3px solid #f6d36b;

      outline-offset: 3px;
    }


    @media (prefers-reduced-motion: reduce) {

      .card,
      .carta-img,
      .sobre-img,
      .llama,
      .confeti,
      .abrir-indicador {
        animation: none !important;

        transition: none !important;
      }

    }

  </style>
</head>


<body>


  <!-- ========================================================
       TARJETA COMPLETA
       ======================================================== -->

  <main class="card-container">

    <div class="card" id="card">


      <!-- ======================================================
           PORTADA = IMAGEN 1
           ====================================================== -->

      <section
        class="card-face front"
        id="portada"
        aria-label="Abrir tarjeta de cumpleaños"
      >

        <img
          src="1.jpg"
          class="portada-img"
          alt="Feliz cumpleaños"
        >

        <div class="abrir-indicador">
          💌 Toca para abrir
        </div>

      </section>



      <!-- ======================================================
           INTERIOR
           ====================================================== -->

      <section
        class="card-face back"
        id="interior"
      >


        <!-- ====================================================
             PÁGINA IZQUIERDA
             SOBRE = IMAGEN 2
             CARTA = IMAGEN 3
             ==================================================== -->

        <div class="page page-left">

          <div
            class="sobre-wrapper"
            id="sobreWrapper"
          >


            <!-- SOBRE -->
            <img
              src="2.jpg"
              class="sobre-img"
              id="sobreImg"
              alt="Sobre de cumpleaños"
            >


            <!-- CARTA -->
            <img
              src="3.jpg"
              class="carta-img"
              id="cartaImg"
              alt="Carta de cumpleaños"
            >


            <!-- TEXTO CUANDO ESTÁ EL SOBRE -->
            <div class="texto-carta" id="textoCarta">
              💌 Toca la carta para abrirla
            </div>

          </div>


          <!-- BOTÓN PARA VOLVER AL SOBRE -->
          <button
            class="volver-sobre"
            id="volverSobre"
            type="button"
          >
            ↩ Volver al sobre
          </button>

        </div>



        <!-- ====================================================
             PÁGINA DERECHA
             PASTEL = IMAGEN 4
             ==================================================== -->

        <div class="page page-right">


          <div
            class="pastel-wrapper"
            id="pastelWrapper"
          >


            <!-- PASTEL -->
            <img
              src="4.jpg"
              class="pastel-img"
              id="pastelImg"
              alt="Pastel de cumpleaños con velas"
            >


            <!-- =================================================
                 LLAMAS INTERACTIVAS
                 ================================================= -->

            <div
              class="llamas-interactivas"
              id="llamasInteractivas"
            >


              <div class="llama llama1"></div>

              <div class="llama llama2"></div>

              <div class="llama llama3"></div>


              <!-- PARCHES PARA OCULTAR LAS LLAMAS
                   QUE VIENEN DENTRO DE 4.JPG -->

              <div class="apagador apagador1"></div>

              <div class="apagador apagador2"></div>

              <div class="apagador apagador3"></div>


              <!-- HUMO -->

              <div class="humo humo1"></div>

              <div class="humo humo2"></div>

              <div class="humo humo3"></div>

            </div>


            <!-- =================================================
                 MENSAJE
                 ================================================= -->

            <div
              class="mensaje-deseo"
              id="mensajeDeseo"
            >
              ✨ Pide un deseo ✨
              <br>
              🕯️💗
            </div>


            <!-- =================================================
                 CONTROLES
                 ================================================= -->

            <div
              class="controles"
              id="controles"
            >

              <button
                class="boton-soplar"
                id="botonSoplar"
                type="button"
              >
                💨 Mantén para soplar
              </button>


              <button
                class="boton-encender"
                id="botonEncender"
                type="button"
              >
                🕯️ Volver a encender
              </button>

            </div>


            <!-- =================================================
                 MEDIDOR DEL MICRÓFONO
                 ================================================= -->

            <div class="microfono">

              <span>🎙️</span>

              <div class="barra-mic">

                <div
                  class="nivel-mic"
                  id="nivelMic"
                ></div>

              </div>

              <span id="estadoMic">
                toca para activar
              </span>

            </div>


            <div class="ayuda-soplo">
              💨 También puedes soplar al micrófono
            </div>


          </div>

        </div>


      </section>

    </div>

  </main>



  <!-- ========================================================
       CONFETI
       ======================================================== -->

  <div
    class="confeti-container"
    id="confetiContainer"
  ></div>



  <!-- ========================================================
       JAVASCRIPT
       ======================================================== -->

  <script>

    "use strict";


    /* ========================================================
       ELEMENTOS
       ======================================================== */

    const card =
      document.getElementById("card");

    const portada =
      document.getElementById("portada");

    const sobreWrapper =
      document.getElementById("sobreWrapper");

    const cartaImg =
      document.getElementById("cartaImg");

    const volverSobre =
      document.getElementById("volverSobre");

    const botonSoplar =
      document.getElementById("botonSoplar");

    const botonEncender =
      document.getElementById("botonEncender");

    const pastelWrapper =
      document.getElementById("pastelWrapper");

    const nivelMic =
      document.getElementById("nivelMic");

    const estadoMic =
      document.getElementById("estadoMic");

    const mensajeDeseo =
      document.getElementById("mensajeDeseo");

    const confetiContainer =
      document.getElementById("confetiContainer");

    const llamas =
      document.querySelectorAll(".llama");


    /* ========================================================
       ESTADOS
       ======================================================== */

    let tarjetaAbierta = false;

    let cartaAbierta = false;

    let velasApagadas = false;

    let soplandoManual = false;

    let manualTimer = null;

    let audioContext = null;

    let stream = null;

    let source = null;

    let analyser = null;

    let micActivo = false;

    let animationFrame = null;

    let tiempoSoplando = 0;


    /* ========================================================
       CONFIGURACIÓN DEL SOPLO
       ======================================================== */

    const UMBRAL_SOPLO = 0.32;

    const TIEMPO_PARA_APAGAR = 650;

    const INCLINACION = 25;


    /* ========================================================
       ABRIR TARJETA
       ======================================================== */

    function abrirTarjeta() {

      if (tarjetaAbierta) {
        return;
      }

      tarjetaAbierta = true;

      card.classList.add("open");

      /* Permitimos que el navegador termine
         la animación antes de activar algunas cosas */

      setTimeout(() => {

        iniciarMicrofono();

      }, 900);

    }


    /* ========================================================
       CERRAR TARJETA
       ======================================================== */

    function cerrarTarjeta() {

      tarjetaAbierta = false;

      card.classList.remove("open");

      cerrarCarta();

      detenerMicrofono();

    }


    /* ========================================================
       ABRIR CARTA
       ======================================================== */

    function abrirCarta() {

      if (!tarjetaAbierta) {
        return;
      }

      if (cartaAbierta) {
        return;
      }

      cartaAbierta = true;

      sobreWrapper.classList.add("carta-abierta");

      volverSobre.classList.add("visible");

    }


    /* ========================================================
       CERRAR CARTA / VOLVER AL SOBRE
       ======================================================== */

    function cerrarCarta() {

      cartaAbierta = false;

      sobreWrapper.classList.remove("carta-abierta");

      volverSobre.classList.remove("visible");

    }


    /* ========================================================
       SOPLAR MANUALMENTE
       ======================================================== */

    function empezarSoploManual(event) {

      event.preventDefault();

      if (!tarjetaAbierta) {
        return;
      }

      if (velasApagadas) {
        return;
      }

      if (soplandoManual) {
        return;
      }

      soplandoManual = true;

      inclinarLlamas(true);

      let tiempo = 0;

      manualTimer =
        setInterval(() => {

          tiempo += 50;

          if (
            tiempo >= TIEMPO_PARA_APAGAR &&
            !velasApagadas
          ) {

            apagarVelas();

            detenerIntervaloManual();

          }

        }, 50);

    }


    /* ========================================================
       DETENER SOPLO MANUAL
       ======================================================== */

    function terminarSoploManual(event) {

      if (event) {
        event.preventDefault();
      }

      soplandoManual = false;

      detenerIntervaloManual();

      if (!velasApagadas) {

        inclinarLlamas(false);

      }

    }


    /* ========================================================
       DETENER INTERVALO
       ======================================================== */

    function detenerIntervaloManual() {

      if (manualTimer !== null) {

        clearInterval(manualTimer);

        manualTimer = null;

      }

    }


    /* ========================================================
       INCLINAR LLAMAS
       ======================================================== */

    function inclinarLlamas(inclinadas) {

      llamas.forEach(
        (llama, indice) => {

          let angulo = 0;

          if (inclinadas) {

            if (indice === 0) {
              angulo = -INCLINACION;
            }

            else if (indice === 1) {
              angulo = -8;
            }

            else if (indice === 2) {
              angulo = INCLINACION;
            }

          }

          llama.style.transform =
            `rotate(${angulo}deg)`;

        }
      );

    }


    /* ========================================================
       APAGAR VELAS
       ======================================================== */

    function apagarVelas() {

      if (velasApagadas) {
        return;
      }

      velasApagadas = true;

      pastelWrapper.classList.add("velas-apagadas");

      inclinarLlamas(false);

      detenerIntervaloManual();

      soplandoManual = false;

      mensajeDeseo.classList.add("visible");

      lanzarConfeti();

      detenerMicrofono();

      nivelMic.style.width = "0%";

      estadoMic.textContent =
        "velas apagadas";

    }


    /* ========================================================
       VOLVER A ENCENDER
       ======================================================== */

    function encenderVelas() {

      velasApagadas = false;

      pastelWrapper.classList.remove("velas-apagadas");

      mensajeDeseo.classList.remove("visible");

      limpiarConfeti();

      estadoMic.textContent =
        "toca para activar";

      nivelMic.style.width =
        "0%";

      setTimeout(() => {

        if (tarjetaAbierta) {

          iniciarMicrofono();

        }

      }, 300);

    }


    /* ========================================================
       MICRÓFONO
       ======================================================== */

    async function iniciarMicrofono() {

      if (micActivo) {
        return;
      }

      if (velasApagadas) {
        return;
      }

      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {

        estadoMic.textContent =
          "usa el botón 💨";

        return;

      }


      try {

        stream =
          await navigator.mediaDevices.getUserMedia({
            audio: true
          });


        audioContext =
          new (
            window.AudioContext ||
            window.webkitAudioContext
          )();


        source =
          audioContext.createMediaStreamSource(
            stream
          );


        analyser =
          audioContext.createAnalyser();


        analyser.fftSize = 256;


        source.connect(analyser);


        micActivo = true;


        estadoMic.textContent =
          "escuchando";


        analizarMicrofono();

      }

      catch (error) {

        console.warn(
          "No se pudo acceder al micrófono:",
          error
        );


        estadoMic.textContent =
          "usa el botón 💨";

      }

    }


    /* ========================================================
       ANALIZAR MICRÓFONO
       ======================================================== */

    function analizarMicrofono() {

      if (
        !micActivo ||
        !analyser
      ) {

        return;

      }


      const datos =
        new Uint8Array(
          analyser.frequencyBinCount
        );


      analyser.getByteFrequencyData(datos);


      let suma = 0;


      for (
        let i = 0;
        i < datos.length;
        i++
      ) {

        suma += datos[i];

      }


      const promedio =
        suma /
        datos.length /
        255;


      const nivel =
        Math.min(
          promedio * 2.6,
          1
        );


      nivelMic.style.width =
        `${nivel * 100}%`;


      if (
        nivel > UMBRAL_SOPLO &&
        !velasApagadas
      ) {

        tiempoSoplando += 50;

        inclinarLlamas(true);


        if (
          tiempoSoplando >=
          TIEMPO_PARA_APAGAR
        ) {

          apagarVelas();

          tiempoSoplando = 0;

        }

      }

      else {

        tiempoSoplando = 0;

        if (!velasApagadas) {

          inclinarLlamas(false);

        }

      }


      animationFrame =
        requestAnimationFrame(
          analizarMicrofono
        );

    }


    /* ========================================================
       DETENER MICRÓFONO
       ======================================================== */

    function detenerMicrofono() {

      if (stream) {

        stream
          .getTracks()
          .forEach(
            track => track.stop()
          );

        stream = null;

      }


      if (audioContext) {

        audioContext
          .close()
          .catch(() => {});

        audioContext = null;

      }


      source = null;

      analyser = null;

      micActivo = false;


      if (animationFrame) {

        cancelAnimationFrame(
          animationFrame
        );

        animationFrame = null;

      }


      nivelMic.style.width =
        "0%";


      if (!velasApagadas) {

        estadoMic.textContent =
          "toca para activar";

      }

    }


    /* ========================================================
       CONFETI
       ======================================================== */

    function lanzarConfeti() {

      limpiarConfeti();


      const colores = [
        "#a52d35",
        "#d96b72",
        "#f1c453",
        "#6f7e5d",
        "#e68d91",
        "#8c4c4c",
        "#fff1d8"
      ];


      for (
        let i = 0;
        i < 70;
        i++
      ) {

        const pieza =
          document.createElement(
            "div"
          );


        pieza.className =
          "confeti";


        const tamano =
          5 +
          Math.random() * 9;


        pieza.style.width =
          `${tamano}px`;


        pieza.style.height =
          `${tamano * 1.4}px`;


        pieza.style.left =
          `${Math.random() * 100}%`;


        pieza.style.background =
          colores[
            Math.floor(
              Math.random() *
              colores.length
            )
          ];


        pieza.style.borderRadius =
          Math.random() > 0.5
            ? "50%"
            : "2px";


        pieza.style.animationDuration =
          `${2.2 + Math.random() * 2.5}s`;


        pieza.style.animationDelay =
          `${Math.random() * 0.7}s`;


        confetiContainer.appendChild(
          pieza
        );


        setTimeout(
          () => {

            if (pieza.parentNode) {

              pieza.remove();

            }

          },
          5500
        );

      }

    }


    /* ========================================================
       LIMPIAR CONFETI
       ======================================================== */

    function limpiarConfeti() {

      confetiContainer.innerHTML =
        "";

    }


    /* ========================================================
       EVENTO: PORTADA
       ======================================================== */

    portada.addEventListener(
      "click",
      function() {

        if (!tarjetaAbierta) {

          abrirTarjeta();

        }

      }
    );


    /* ========================================================
       EVENTO: CARTA
       ======================================================== */

    cartaImg.addEventListener(
      "click",
      function(event) {

        event.stopPropagation();

        if (!cartaAbierta) {

          abrirCarta();

        }

        else {

          cerrarCarta();

        }

      }
    );


    /* ========================================================
       EVENTO: VOLVER AL SOBRE
       ======================================================== */

    volverSobre.addEventListener(
      "click",
      function(event) {

        event.stopPropagation();

        cerrarCarta();

      }
    );


    /* ========================================================
       EVENTOS DEL BOTÓN DE SOPLAR
       ======================================================== */

    botonSoplar.addEventListener(
      "mousedown",
      empezarSoploManual
    );


    botonSoplar.addEventListener(
      "mouseup",
      terminarSoploManual
    );


    botonSoplar.addEventListener(
      "mouseleave",
      terminarSoploManual
    );


    botonSoplar.addEventListener(
      "touchstart",
      empezarSoploManual,
      {
        passive: false
      }
    );


    botonSoplar.addEventListener(
      "touchend",
      terminarSoploManual,
      {
        passive: false
      }
    );


    botonSoplar.addEventListener(
      "touchcancel",
      terminarSoploManual,
      {
        passive: false
      }
    );


    /* ========================================================
       BOTÓN VOLVER A ENCENDER
       ======================================================== */

    botonEncender.addEventListener(
      "click",
      function(event) {

        event.stopPropagation();

        encenderVelas();

      }
    );


    /* ========================================================
       BARRA ESPACIADORA = SOPLAR
       ======================================================== */

    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.code === "Space" &&
          tarjetaAbierta &&
          !velasApagadas
        ) {

          event.preventDefault();

          if (!soplandoManual) {

            empezarSoploManual(event);

          }

        }

      }
    );


    document.addEventListener(
      "keyup",
      function(event) {

        if (
          event.code === "Space"
        ) {

          event.preventDefault();

          terminarSoploManual(event);

        }

      }
    );


    /* ========================================================
       ACTIVAR MICRÓFONO CON CLIC EN EL INTERIOR
       ======================================================== */

    document.addEventListener(
      "click",
      function() {

        if (
          tarjetaAbierta &&
          !micActivo &&
          !velasApagadas
        ) {

          iniciarMicrofono();

        }

      }
    );


    /* ========================================================
       INICIO
       ======================================================== */

    card.classList.remove("open");

    sobreWrapper.classList.remove(
      "carta-abierta"
    );

    pastelWrapper.classList.remove(
      "velas-apagadas"
    );

    tarjetaAbierta = false;

    cartaAbierta = false;

    velasApagadas = false;


    console.log(
      "💌 Tarjeta de cumpleaños lista."
    );

  </script>
