<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Cumple Veil 💌</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,.35), transparent 30%),
    linear-gradient(135deg, #d9b08f, #efd4b7 50%, #d5aa88);
  font-family: Georgia, "Times New Roman", serif;
  overflow-x: hidden;
  color: #542d2d;
}

/* -------------------------
   FONDO
------------------------- */

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .18;
  background-image:
    radial-gradient(#6d4141 1px, transparent 1px);
  background-size: 14px 14px;
}

/* -------------------------
   CONTENEDOR PRINCIPAL
------------------------- */

.page {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 35px 20px;
  position: relative;
}

.title {
  position: absolute;
  top: 25px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  z-index: 30;
  color: #fff8ed;
  text-shadow: 0 2px 5px rgba(75,35,25,.3);
  pointer-events: none;
}

.title h1 {
  font-size: clamp(20px, 3vw, 34px);
  letter-spacing: 2px;
}

.title p {
  margin-top: 5px;
  font-size: 13px;
  letter-spacing: 1px;
}

/* -------------------------
   ESCENARIO
------------------------- */

.scene {
  width: min(94vw, 1050px);
  height: min(78vh, 720px);
  min-height: 500px;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  perspective: 1800px;
}

/* -------------------------
   PORTADA
------------------------- */

.cover {
  position: absolute;
  z-index: 20;
  width: min(72vw, 470px);
  height: min(72vh, 705px);
  max-height: 705px;
  aspect-ratio: 2 / 3;

  cursor: pointer;
  transform-origin: left center;

  transition:
    transform 1.25s cubic-bezier(.2,.75,.2,1),
    opacity .7s ease,
    filter .7s ease;
}

.cover img {
  width: 100%;
  height: 100%;
  display: block;

  object-fit: contain;

  border-radius: 4px;

  box-shadow:
    0 22px 45px rgba(72,35,25,.28),
    0 5px 12px rgba(72,35,25,.18);

  user-select: none;
  -webkit-user-drag: none;
}

.cover::after {
  content: "CLICK PARA ABRIR 💌";
  position: absolute;
  bottom: -42px;
  left: 50%;
  transform: translateX(-50%);

  white-space: nowrap;

  background: rgba(255,248,237,.92);
  padding: 8px 15px;
  border-radius: 20px;

  font-size: 11px;
  letter-spacing: 1.5px;
  color: #713c3c;

  box-shadow: 0 5px 15px rgba(70,30,20,.12);
}

.scene.open .cover {
  transform:
    translateX(-420px)
    rotateY(-78deg)
    scale(.92);

  opacity: 0;
  pointer-events: none;
}

/* -------------------------
   TARJETA INTERIOR
------------------------- */

.inside {
  position: absolute;

  width: min(94vw, 950px);
  height: min(62vh, 560px);
  min-height: 420px;

  display: flex;

  background: #ead0ad;

  border-radius: 4px;

  box-shadow:
    0 28px 60px rgba(70,32,20,.32),
    0 5px 12px rgba(70,32,20,.18);

  overflow: hidden;

  opacity: 0;
  transform: scale(.78) rotateX(7deg);

  transition:
    opacity .9s ease .35s,
    transform 1s cubic-bezier(.2,.75,.2,1);

  pointer-events: none;
}

.scene.open .inside {
  opacity: 1;
  transform: scale(1) rotateX(0);
  pointer-events: auto;
}

/* -------------------------
   MITADES
------------------------- */

.page-half {
  width: 50%;
  height: 100%;
  position: relative;
  overflow: hidden;
}

.left-page {
  border-right: 1px solid rgba(110,65,45,.12);
  background:
    linear-gradient(rgba(255,255,255,.18), rgba(255,255,255,.18)),
    #e8c69e;
}

.right-page {
  background:
    linear-gradient(rgba(255,255,255,.15), rgba(255,255,255,.15)),
    #e3bd92;
}

/* -------------------------
   DECORACIÓN
------------------------- */

.left-page::before,
.right-page::before {
  content: "";
  position: absolute;
  inset: 13px;

  border: 1px solid rgba(107,54,48,.16);

  pointer-events: none;
}

.sticker {
  position: absolute;
  font-size: 24px;
  z-index: 5;
}

.star1 {
  top: 25px;
  left: 28px;
  transform: rotate(-12deg);
}

.star2 {
  top: 32px;
  right: 30px;
  transform: rotate(15deg);
}

.heart {
  bottom: 24px;
  left: 30px;
  transform: rotate(-10deg);
}

/* -------------------------
   SOBRE
------------------------- */

.envelope-area {
  position: absolute;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  transition:
    opacity .5s ease,
    transform .8s cubic-bezier(.2,.8,.2,1);
}

.envelope {
  width: 72%;
  max-width: 330px;
  cursor: pointer;

  filter:
    drop-shadow(0 15px 13px rgba(70,35,25,.2));

  transition:
    transform .5s ease,
    filter .5s ease;
}

.envelope:hover {
  transform: translateY(-7px) rotate(-1deg);
  filter:
    drop-shadow(0 20px 18px rgba(70,35,25,.25));
}

.envelope img {
  width: 100%;
  display: block;
}

.envelope-text {
  position: absolute;
  bottom: 48px;
  left: 50%;
  transform: translateX(-50%);

  background: rgba(255,247,232,.9);
  padding: 8px 14px;

  border-radius: 20px;

  font-size: 11px;
  letter-spacing: 1px;

  color: #693838;
  white-space: nowrap;
}

/* -------------------------
   CARTA
------------------------- */

.letter {
  position: absolute;
  inset: 8%;
  z-index: 10;

  display: flex;
  align-items: center;
  justify-content: center;

  opacity: 0;
  transform:
    translateY(45px)
    scale(.75)
    rotate(-2deg);

  pointer-events: none;

  transition:
    opacity .7s ease,
    transform .8s cubic-bezier(.2,.8,.2,1);
}

.letter img {
  width: 100%;
  height: 100%;
  object-fit: contain;

  filter:
    drop-shadow(0 15px 15px rgba(70,35,25,.22));
}

.left-page.letter-open .envelope-area {
  opacity: 0;
  transform: scale(.85);
  pointer-events: none;
}

.left-page.letter-open .letter {
  opacity: 1;
  transform:
    translateY(0)
    scale(1)
    rotate(0deg);

  pointer-events: auto;
}

/* -------------------------
   BOTÓN CERRAR CARTA
------------------------- */

.close-letter {
  position: absolute;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);

  border: none;
  background: #fff5e8;
  color: #693838;

  padding: 9px 17px;
  border-radius: 20px;

  font-family: inherit;
  font-size: 12px;

  cursor: pointer;

  box-shadow: 0 5px 12px rgba(70,35,25,.15);

  z-index: 30;

  opacity: 0;
  pointer-events: none;

  transition: .3s ease;
}

.left-page.letter-open .close-letter {
  opacity: 1;
  pointer-events: auto;
}

.close-letter:hover {
  transform: translateX(-50%) translateY(-2px);
}

/* -------------------------
   TORTA
------------------------- */

.cake-area {
  position: absolute;
  inset: 0;

  display: flex;
  justify-content: center;
  align-items: center;
}

.cake-wrap {
  width: 82%;
  max-width: 430px;
  position: relative;

  animation: cakeFloat 4s ease-in-out infinite;
}

@keyframes cakeFloat {
  0%,100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-7px);
  }
}

.cake-img {
  width: 100%;
  display: block;

  filter:
    drop-shadow(0 17px 16px rgba(65,30,20,.2));

  user-select: none;
}

/* -------------------------
   LLAMAS
------------------------- */

.flame {
  position: absolute;

  width: 25px;
  height: 38px;

  z-index: 10;

  cursor: pointer;

  transform-origin: bottom center;

  background:
    radial-gradient(
      ellipse at center bottom,
      #fff5a8 0%,
      #ffb52e 38%,
      #e65335 65%,
      transparent 70%
    );

  clip-path: polygon(
    50% 100%,
    18% 70%,
    22% 42%,
    43% 0%,
    62% 35%,
    78% 18%,
    82% 60%,
    68% 82%
  );

  animation:
    flicker .12s infinite alternate;
}

@keyframes flicker {
  from {
    transform: scale(1) rotate(-2deg);
  }

  to {
    transform: scale(1.08,.94) rotate(3deg);
  }
}

.flame1 {
  left: 24.5%;
  top: 31.5%;
}

.flame2 {
  left: 47%;
  top: 30.5%;
}

.flame3 {
  left: 69.5%;
  top: 31.5%;
}

/* -------------------------
   LLAMAS APAGADAS
------------------------- */

.scene.candles-out .flame {
  opacity: 0;
  transform: scale(.2) translateY(20px);
  animation: none;
  pointer-events: none;
  transition: .4s ease;
}

/* humo */

.smoke {
  position: absolute;

  width: 15px;
  height: 15px;

  border-radius: 50%;

  background: rgba(255,255,255,.65);

  filter: blur(2px);

  opacity: 0;
  pointer-events: none;
}

.scene.candles-out .smoke {
  opacity: .8;
  animation: smoke 2s ease-out forwards;
}

.smoke1 {
  left: 25%;
  top: 29%;
}

.smoke2 {
  left: 47.5%;
  top: 28%;
  animation-delay: .12s !important;
}

.smoke3 {
  left: 70%;
  top: 29%;
  animation-delay: .25s !important;
}

@keyframes smoke {
  0% {
    transform: translateY(5px) scale(.4);
    opacity: .1;
  }

  40% {
    opacity: .8;
  }

  100% {
    transform:
      translateY(-70px)
      translateX(15px)
      scale(2.8);

    opacity: 0;
  }
}

/* -------------------------
   BOTÓN SOPLAR
------------------------- */

.blow-area {
  position: absolute;

  bottom: 28px;
  left: 50%;

  transform: translateX(-50%);

  z-index: 20;

  display: flex;
  gap: 8px;
  align-items: center;
}

.blow-btn,
.relight-btn {
  border: none;

  background: #fff5e8;
  color: #683737;

  padding: 10px 17px;

  border-radius: 22px;

  font-family: inherit;
  font-size: 12px;
  letter-spacing: .5px;

  cursor: pointer;

  box-shadow:
    0 5px 15px rgba(70,35,25,.17);

  transition: .25s ease;
}

.blow-btn:hover,
.relight-btn:hover {
  transform: translateY(-2px);
  box-shadow:
    0 8px 18px rgba(70,35,25,.22);
}

.blow-btn:active {
  transform: scale(.95);
}

.relight-btn {
  display: none;
}

.scene.candles-out .relight-btn {
  display: block;
}

/* -------------------------
   MENSAJE FINAL
------------------------- */

.birthday-message {
  position: absolute;

  top: 20px;
  left: 50%;

  transform:
    translateX(-50%)
    translateY(-20px)
    scale(.8);

  opacity: 0;

  background: rgba(255,247,234,.95);

  padding: 10px 18px;

  border-radius: 30px;

  font-size: 13px;
  letter-spacing: .5px;

  color: #713b3b;

  white-space: nowrap;

  box-shadow: 0 8px 20px rgba(70,35,25,.15);

  transition: .6s ease;

  z-index: 30;
}

.scene.candles-out .birthday-message {
  opacity: 1;

  transform:
    translateX(-50%)
    translateY(0)
    scale(1);
}

/* -------------------------
   CONFETI
------------------------- */

.confetti {
  position: fixed;
  width: 8px;
  height: 13px;

  top: -20px;

  z-index: 100;

  pointer-events: none;

  opacity: 0;

  animation: confettiFall 2.8s ease-out forwards;
}

@keyframes confettiFall {
  0% {
    transform:
      translateY(-20px)
      rotate(0deg);

    opacity: 1;
  }

  100% {
    transform:
      translateY(105vh)
      translateX(var(--x))
      rotate(720deg);

    opacity: 0;
  }
}

/* -------------------------
   BOTÓN CERRAR TARJETA
------------------------- */

.close-card {
  position: absolute;

  bottom: -48px;
  left: 50%;

  transform: translateX(-50%);

  border: none;

  background: rgba(255,247,235,.95);
  color: #693838;

  padding: 9px 18px;

  border-radius: 20px;

  font-family: inherit;
  font-size: 11px;

  letter-spacing: 1px;

  cursor: pointer;

  box-shadow: 0 5px 15px rgba(70,35,25,.15);

  opacity: 0;

  pointer-events: none;

  transition: .3s ease;

  z-index: 50;
}

.scene.open .close-card {
  opacity: 1;
  pointer-events: auto;
}

.close-card:hover {
  transform: translateX(-50%) translateY(-2px);
}

/* -------------------------
   RESPONSIVE
------------------------- */

@media (max-width: 750px) {

  .page {
    padding-top: 65px;
    padding-bottom: 65px;
  }

  .title {
    top: 15px;
  }

  .scene {
    width: 94vw;
    height: auto;
    min-height: 0;
    padding: 20px 0;
  }

  .cover {
    position: relative;

    width: min(78vw, 390px);
    height: auto;

    aspect-ratio: 2 / 3;
  }

  .scene.open {
    min-height: 760px;
  }

  .scene.open .cover {
    position: absolute;
  }

  .inside {
    position: relative;

    width: 94vw;
    height: auto;
    min-height: 0;

    flex-direction: column;

    overflow: visible;
  }

  .page-half {
    width: 100%;
    height: 420px;
  }

  .left-page {
    border-right: none;
    border-bottom: 1px solid rgba(110,65,45,.12);
  }

  .right-page {
    height: 470px;
  }

  .scene.open .inside {
    transform: scale(.95);
  }

  .close-card {
    bottom: -42px;
  }

  .birthday-message {
    font-size: 11px;
    max-width: 85%;
    text-align: center;
    white-space: normal;
  }
}

@media (max-width: 450px) {

  .page {
    padding-left: 10px;
    padding-right: 10px;
  }

  .scene.open {
    min-height: 830px;
  }

  .page-half {
    height: 390px;
  }

  .right-page {
    height: 450px;
  }

  .envelope {
    width: 76%;
  }

  .cake-wrap {
    width: 88%;
  }

  .blow-area {
    bottom: 18px;
  }

  .blow-btn,
  .relight-btn {
    padding: 9px 13px;
    font-size: 11px;
  }
}
</style>
</head>

<body>

<div class="page">

  <div class="title">
    <h1>para ti, con mucho cariño 💌</h1>
    <p>una pequeña sorpresa</p>
  </div>

  <div class="scene" id="scene">

    <!-- =========================
         PORTADA — IMAGEN 1
    ========================== -->

    <div class="cover" id="cover">
      <img src="1.jpg" alt="Portada de cumpleaños">
    </div>


    <!-- =========================
         INTERIOR DE LA TARJETA
    ========================== -->

    <div class="inside">

      <!-- ======================
           PÁGINA IZQUIERDA
      ======================= -->

      <div class="page-half left-page" id="leftPage">

        <span class="sticker star1">✦</span>
        <span class="sticker star2">✧</span>
        <span class="sticker heart">♡</span>


        <!-- SOBRE — IMAGEN 2 -->

        <div class="envelope-area">

          <div class="envelope" id="envelope">
            <img src="2.jpg" alt="Sobre de cumpleaños">

            <div class="envelope-text">
              CLICK A LA CARTA UWU 💌
            </div>
          </div>

        </div>


        <!-- CARTA — IMAGEN 3 -->

        <div class="letter">

          <img src="3.jpg" alt="Carta de cumpleaños">

          <button class="close-letter" id="closeLetter">
            ← volver al sobre
          </button>

        </div>

      </div>


      <!-- ======================
           PÁGINA DERECHA
      ======================= -->

      <div class="page-half right-page">

        <span class="sticker star1">✦</span>
        <span class="sticker star2">♡</span>


        <div class="cake-area">

          <div class="cake-wrap">

            <!-- IMAGEN 4 -->

            <img
              src="4.jpg"
              class="cake-img"
              alt="Pastel de cumpleaños"
            >


            <!-- LLAMAS INTERACTIVAS -->

            <div class="flame flame1"></div>
            <div class="flame flame2"></div>
            <div class="flame flame3"></div>


            <!-- HUMO -->

            <div class="smoke smoke1"></div>
            <div class="smoke smoke2"></div>
            <div class="smoke smoke3"></div>

          </div>

        </div>


        <!-- MENSAJE -->

        <div class="birthday-message">
          ✨ ¡FELIZ CUMPLE! ✨
        </div>


        <!-- BOTONES -->

        <div class="blow-area">

          <button class="blow-btn" id="blowBtn">
            🌬️ Mantén para soplar
          </button>

          <button class="relight-btn" id="relightBtn">
            🕯️ Encender otra vez
          </button>

        </div>

      </div>

    </div>


    <!-- CERRAR TARJETA -->

    <button class="close-card" id="closeCard">
      cerrar tarjeta ↩
    </button>

  </div>

</div>


<script>

/* ==========================================
   ELEMENTOS
========================================== */

const scene = document.getElementById("scene");

const cover = document.getElementById("cover");

const envelope = document.getElementById("envelope");

const leftPage = document.getElementById("leftPage");

const closeLetter = document.getElementById("closeLetter");

const closeCard = document.getElementById("closeCard");

const blowBtn = document.getElementById("blowBtn");

const relightBtn = document.getElementById("relightBtn");


/* ==========================================
   ABRIR TARJETA
========================================== */

cover.addEventListener("click", () => {

  scene.classList.add("open");

});


/* ==========================================
   CERRAR TARJETA
========================================== */

closeCard.addEventListener("click", () => {

  scene.classList.remove("open");

  leftPage.classList.remove("letter-open");

  scene.classList.remove("candles-out");

});


/* ==========================================
   ABRIR CARTA
========================================== */

envelope.addEventListener("click", () => {

  leftPage.classList.add("letter-open");

});


/* ==========================================
   VOLVER AL SOBRE
========================================== */

closeLetter.addEventListener("click", (event) => {

  event.stopPropagation();

  leftPage.classList.remove("letter-open");

});


/* ==========================================
   APAGAR VELAS
========================================== */

function blowCandles() {

  if (scene.classList.contains("candles-out")) {
    return;
  }

  scene.classList.add("candles-out");

  createConfetti();

}


/* ==========================================
   VOLVER A ENCENDER
========================================== */

relightBtn.addEventListener("click", () => {

  scene.classList.remove("candles-out");

});


/* ==========================================
   BOTÓN DE SOPLAR
========================================== */

let pressTimer;

blowBtn.addEventListener("pointerdown", () => {

  pressTimer = setTimeout(() => {

    blowCandles();

  }, 500);

});


blowBtn.addEventListener("pointerup", () => {

  clearTimeout(pressTimer);

});


blowBtn.addEventListener("pointerleave", () => {

  clearTimeout(pressTimer);

});


/* ==========================================
   TAMBIÉN SE PUEDEN CLICKEAR LAS LLAMAS
========================================== */

document.querySelectorAll(".flame").forEach(flame => {

  flame.addEventListener("click", blowCandles);

});


/* ==========================================
   CONFETI
========================================== */

function createConfetti() {

  const pieces = 45;

  for (let i = 0; i < pieces; i++) {

    const piece = document.createElement("div");

    piece.className = "confetti";

    piece.style.left =
      Math.random() * 100 + "vw";

    piece.style.setProperty(
      "--x",
      (Math.random() * 300 - 150) + "px"
    );

    piece.style.animationDelay =
      Math.random() * .7 + "s";

    piece.style.transform =
      `rotate(${Math.random() * 360}deg)`;

    document.body.appendChild(piece);

    setTimeout(() => {

      piece.remove();

    }, 3500);

  }

}


/* ==========================================
   MICRÓFONO
   DETECTA CUANDO SOPLAS
========================================== */

let audioContext = null;
let analyser = null;
let microphone = null;
let micStream = null;

async function startMicrophone() {

  try {

    micStream =
      await navigator.mediaDevices.getUserMedia({
        audio: true
      });

    audioContext =
      new (window.AudioContext ||
           window.webkitAudioContext)();

    analyser =
      audioContext.createAnalyser();

    analyser.fftSize = 512;

    microphone =
      audioContext.createMediaStreamSource(micStream);

    microphone.connect(analyser);

    detectBlow();

  } catch (error) {

    console.log(
      "El micrófono no está disponible."
    );

  }

}


/* ==========================================
   DETECTAR SOPLIDO
========================================== */

function detectBlow() {

  if (!analyser) return;

  const data =
    new Uint8Array(analyser.fftSize);

  analyser.getByteTimeDomainData(data);

  let sum = 0;

  for (let i = 0; i < data.length; i++) {

    const value =
      (data[i] - 128) / 128;

    sum += value * value;

  }

  const volume =
    Math.sqrt(sum / data.length);

  if (
    volume > 0.18 &&
    !scene.classList.contains("candles-out")
  ) {

    blowCandles();

  }

  requestAnimationFrame(detectBlow);

}


/* ==========================================
   ACTIVAR MICRÓFONO AL ABRIR TARJETA
========================================== */

cover.addEventListener("click", () => {

  startMicrophone();

});


/* ==========================================
   TECLA ESPACIO = SOPLAR
========================================== */

document.addEventListener("keydown", (event) => {

  if (
    event.code === "Space" &&
    scene.classList.contains("open")
  ) {

    event.preventDefault();

    blowCandles();

  }

});


/* ==========================================
   EVITAR QUE LAS IMÁGENES SE ARRASTREN
========================================== */

document.querySelectorAll("img").forEach(img => {

  img.addEventListener("dragstart", event => {

    event.preventDefault();

  });

});

</script>

</body>
</html>
